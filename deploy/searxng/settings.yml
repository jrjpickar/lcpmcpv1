# SearXNG for LCP JARVIS web research. Private: reachable only from the lcp-mcp container on the compose network.
# The secret comes from SEARXNG_SECRET in the VM .env. JSON output is on because JARVIS reads /search?format=json.
use_default_settings: true

general:
  instance_name: "LCP JARVIS search"
  enable_metrics: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  pool_connections: 20
  pool_maxsize: 4

ui:
  static_use_hash: true
