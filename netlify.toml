[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

[functions.jarvis]
  included_files = ["node_modules/@aaif/goose-binary-linux-*/package.json", "node_modules/@aaif/goose-binary-linux-*/bin/goose"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
